# ==========================================================================
# 1. GENERAL OPTIONS & COLOR SUPPORT
# ==========================================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# Keep status bar completely hidden to maximize vertical screen real estate
set -g status off

# Number windows and panes starting at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Sync clipboard with host
set -s set-clipboard on

# ==========================================================================
# 2. KEYMAPS: PREFIX, SPLITS, TAB CYCLING & CHEAT SHEET
# ==========================================================================
# Change prefix from Ctrl-b to Alt-b
unbind C-b
set-option -g prefix M-b
bind-key M-b send-prefix

# Mimic Neovim split keymaps (Prefix + | for vertical, Prefix + - for horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Cycle through windows/tabs instantly using Alt + comma / Alt + period (no prefix needed)
bind -n M-, previous-window
bind -n M-. next-window

# Fast reload of this config: Alt+b then r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Instant native cheat sheet popup on Alt+b then Space
bind Space display-popup -E -w 45% -h 50% "echo '==================================='; echo '         TMUX CHEAT SHEET         '; echo '==================================='; echo ''; echo '  Prefix: Alt + b'; echo ''; echo '  [Splits & Windows]'; echo '    |  : Vertical split'; echo '    -  : Horizontal split'; echo '    !  : Break pane into new window'; echo '    r  : Reload config'; echo ''; echo '  [Navigation]'; echo '    Alt + h/j/k/l : Move across panes/splits'; echo '    Alt + , / .   : Cycle previous/next tab'; echo ''; echo 'Press any key to close...'; read"

# ==========================================================================
# 3. SEAMLESS ALT + H/J/K/L NAVIGATION (Tmux <-> Neovim)
# ==========================================================================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"

# ==========================================================================
# 4. PLUGINS (SEAMLESS NAVIGATION)
# ==========================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize TPM (must remain at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
